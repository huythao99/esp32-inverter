# Build the ESP32 inverter firmware and publish it as BETA in the CMS whenever
# currentFirmwareVersion (src/shared_state.cpp) changes on main.
#
# Promote to stable from the CMS afterwards (ESP32 Firmware -> Set stable, or
# Staged Rollout). A version that already exists in the CMS is never
# re-uploaded (the backend refuses to overwrite a version anyway).
#
# Release notes for users (app / web "Có gì mới"): the "## <version>" section of
# RELEASE_NOTES.md is sent with the upload. Editing the section of a version
# that is already in the CMS and pushing to main updates it there too.
#
# Repository secrets:
#   CMS_API_URL    https://giabao-inverter.com
#   CMS_USERNAME   CMS admin account used by CI (create a dedicated one)
#   CMS_PASSWORD
name: Firmware (beta)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build + upload even if the version did not change'
        type: boolean
        default: false

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: inverter
  VERSION_FILE: src/shared_state.cpp

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the vX.Y.Z tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            grep -oE 'currentFirmwareVersion *= *"[0-9]+\.[0-9]+\.[0-9]+"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true
          }
          VERSION=$(read_version < "$VERSION_FILE")
          if [ -z "$VERSION" ]; then
            echo "::error file=$VERSION_FILE::currentFirmwareVersion not found"
            exit 1
          fi
          BEFORE="${{ github.event.before }}"
          PREV=""
          if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            PREV=$(git show "$BEFORE:$VERSION_FILE" 2>/dev/null | read_version)
          fi
          CHANGED=false
          if [ "$VERSION" != "$PREV" ] || [ "${{ inputs.force || false }}" = "true" ]; then
            CHANGED=true
          fi
          # Release notes: the "## $VERSION" section of RELEASE_NOTES.md
          # (blank lines around it trimmed). Empty = none.
          NOTES_FILE="$RUNNER_TEMP/release_notes.txt"
          if [ -f RELEASE_NOTES.md ]; then
            awk -v v="$VERSION" '
              /^## / { p = ($2 == v); next }
              p' RELEASE_NOTES.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
          fi
          NOTES_CHANGED=false
          if [ -s "$NOTES_FILE" ]; then
            if [ -z "$PREV" ] || ! git diff --quiet "$BEFORE" HEAD -- RELEASE_NOTES.md 2>/dev/null; then
              NOTES_CHANGED=true
            fi
            [ "${{ inputs.force || false }}" = "true" ] && NOTES_CHANGED=true
            echo "Release notes of $VERSION:"; cat "$NOTES_FILE"
          else
            echo "::notice::RELEASE_NOTES.md has no '## $VERSION' section - users see no release notes"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "notes_changed=$NOTES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "Version: ${PREV:-?} -> $VERSION (changed=$CHANGED, notes_changed=$NOTES_CHANGED)"

      - name: Log in to the CMS
        if: steps.ver.outputs.changed == 'true' || steps.ver.outputs.notes_changed == 'true'
        id: login
        shell: bash
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
          CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
        run: |
          set -euo pipefail
          for s in CMS_API_URL CMS_USERNAME CMS_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::secret $s is not set"; exit 1; }
          done
          BODY=$(jq -n --arg u "$CMS_USERNAME" --arg p "$CMS_PASSWORD" '{username:$u,password:$p}')
          RES=$(curl -sS --fail-with-body -X POST "$CMS_API_URL/api/cms/login" \
            -H 'Content-Type: application/json' -d "$BODY") || {
            echo "::error::CMS login failed: $RES"; exit 1; }
          TOKEN=$(echo "$RES" | jq -r '.accessToken // empty')
          [ -n "$TOKEN" ] || { echo "::error::no accessToken in the login response"; exit 1; }
          echo "::add-mask::$TOKEN"
          # Kept in a file: step outputs holding a masked value can be dropped.
          umask 077
          echo "$TOKEN" > "$RUNNER_TEMP/cms_token"

      - name: Skip if already in the CMS
        if: steps.ver.outputs.changed == 'true' || steps.ver.outputs.notes_changed == 'true'
        id: exists
        shell: bash
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/cms_token")
          LIST=$(curl -sS --fail-with-body "$CMS_API_URL/api/cms/esp-firmwares?product=$PRODUCT" \
            -H "Authorization: Bearer $TOKEN")
          ID=$(echo "$LIST" | jq -r --arg v "$VERSION" 'map(select(.version == $v)) | .[0]._id // empty')
          if [ -n "$ID" ]; then
            echo "::notice::$PRODUCT v$VERSION is already in the CMS - nothing to upload"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pip install --upgrade platformio
          pio run -e esp32dev
          BIN=.pio/build/esp32dev/firmware.bin
          test -s "$BIN"
          grep -aq "${{ steps.ver.outputs.version }}" "$BIN" || {
            echo "::error::firmware.bin does not contain version ${{ steps.ver.outputs.version }}"; exit 1; }
          echo "Size: $(stat -c %s "$BIN") bytes"

      - name: Keep the build
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ steps.ver.outputs.version }}
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
          retention-days: 90

      - name: Upload to the CMS as beta
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        shell: bash
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/cms_token")
          NOTES="CI $(git rev-parse --short HEAD): $(git log -1 --pretty=%s | cut -c1-200)"
          RES=$(curl -sS --fail-with-body -X POST "$CMS_API_URL/api/cms/esp-firmwares/upload" \
            -H "Authorization: Bearer $TOKEN" \
            -F "bin=@.pio/build/esp32dev/firmware.bin;type=application/octet-stream" \
            -F "product=$PRODUCT" \
            -F "version=$VERSION" \
            -F "activate=beta" \
            -F "notes=$NOTES" \
            -F "releaseNotes=<${{ steps.ver.outputs.notes_file }}") || { echo "::error::upload failed: $RES"; exit 1; }
          echo "$RES" | jq '{version, channels, size, sha256, warning}'
          WARN=$(echo "$RES" | jq -r '.warning // empty')
          [ -z "$WARN" ] || echo "::warning::$WARN"
          echo "### $PRODUCT v$VERSION uploaded and set as **beta**" >> "$GITHUB_STEP_SUMMARY"
          echo "Promote it in the CMS (ESP32 Firmware -> Set stable, or Staged Rollout)." >> "$GITHUB_STEP_SUMMARY"

      # Version already in the CMS (e.g. only RELEASE_NOTES.md changed):
      # update its release notes there.
      - name: Update release notes in the CMS
        if: steps.exists.outputs.found == 'true' && steps.ver.outputs.notes_changed == 'true'
        shell: bash
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          ID: ${{ steps.exists.outputs.id }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/cms_token")
          BODY=$(jq -n --rawfile n "${{ steps.ver.outputs.notes_file }}" '{releaseNotes: $n}')
          curl -sS --fail-with-body -X PATCH "$CMS_API_URL/api/cms/esp-firmwares/$ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$BODY" >/dev/null || { echo "::error::could not update the release notes"; exit 1; }
          echo "### Release notes of $PRODUCT v$VERSION updated in the CMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        if: steps.ver.outputs.changed == 'true' && steps.exists.outputs.found != 'true'
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" && git push origin "$TAG" || echo "::warning::could not push tag $TAG"
          fi
