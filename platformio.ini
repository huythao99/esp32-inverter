; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    knolleary/PubSubClient@^2.8
    ; Maintained successor of me-no-dev/ESPAsyncWebServer (the old git URL
    ; redirects here). Pinned so every build uses the same library.
    ; 3.12.x requires AsyncTCP >= 3.5.0.
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -Os                      ; optimize for size
    -DCORE_DEBUG_LEVEL=0     ; strip arduino-esp32 internal debug logging
    ; async_tcp task stack (default 16 KB). Only the local setup web server
    ; (192.168.4.1) runs on it; its handlers are tiny. Check the STACK_STATS
    ; log (async=...) before lowering further to 4096.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=6144
